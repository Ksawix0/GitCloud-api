info:
  name: LakeGet
  type: http
  seq: 1

http:
  method: GET
  url: "{{GitCloudAddress}}/lake/:path?root=/"
  params:
    - name: root
      value: /
      type: query
    - name: path
      value: .gcpasswd
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
