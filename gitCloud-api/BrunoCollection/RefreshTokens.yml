info:
  name: RefreshTokens
  type: http
  seq: 5
  tags:
    - Login

http:
  method: GET
  url: "{{GitCloudAddress}}/refreshtokens"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("AccesToken", res.body.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
