opencollection: 1.0.0

info:
  name: GitCloud
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{AccesToken}}"
  scripts:
    - type: after-response
      code: if(res.status == 401 && !req.getTags().includes("Login")){bru.runRequest("RefreshTokens");}
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{GitCloudAddress}}"
